[package]
name = "synh8"
version = "0.1.1"
edition = "2024"
description = "A synaptic-inspired TUI for managing APT packages on Debian/Ubuntu. Linux only."
license = "MIT"
repository = "https://github.com/folknor/synh8"
keywords = ["apt", "tui", "debian", "ubuntu", "package-manager"]
categories = ["command-line-utilities"]
rust-version = "1.99"
exclude = ["CLAUDE.md", "notes/"]

[dependencies]
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
crossterm = "0.29"
color-eyre = "0.6"
rust-apt = "0.11.2"
rusqlite = { version = "0.40.1", features = ["bundled"] }
libc = "0.2"
hotpath = "0.26.0"

[features]
hotpath = ["hotpath/hotpath"]
hotpath-alloc = ["hotpath/hotpath", "hotpath/hotpath-alloc"]

[[bin]]
name = "synh8"
path = "src/main.rs"

[lints.clippy]
# Style
uninlined_format_args = "deny"
cloned_instead_of_copied = "deny"
redundant_closure_for_method_calls = "deny"
semicolon_if_nothing_returned = "deny"
manual_string_new = "deny"
explicit_iter_loop = "deny"
implicit_clone = "deny"
needless_borrow = "deny"
redundant_locals = "deny"

# Correctness
collapsible_match = "deny"
if_same_then_else = "deny"
unnecessary_unwrap = "deny"
wrong_self_convention = "deny"
let_underscore_must_use = "deny"
ok_expect = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
clone_on_ref_ptr = "deny"
float_cmp = "deny"
regex_creation_in_loops = "deny"

# Performance
unnecessary_sort_by = "deny"

# API design
ptr_arg = "deny"
